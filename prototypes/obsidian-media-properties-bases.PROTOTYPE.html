<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PROTOTYPE — Obsidian Properties + Bases 管理 Media</title>
  <style>
    :root{--bg:#f5f1e8;--paper:#fffdf7;--ink:#25241f;--muted:#777269;--line:#ddd6c8;--accent:#7557c5;--green:#378c67;--amber:#c27a22;--red:#b75252;--shadow:0 12px 35px #41392118}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:#25231f;color:#eee9df;padding:22px 16px;position:sticky;top:0;height:100vh}.brand{font-size:18px;font-weight:750;margin:0 8px 24px}.brand small{display:block;color:#9d978d;font-weight:500;font-size:11px;margin-top:5px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#bbb5ab;text-align:left;padding:10px 12px;border-radius:8px;font-size:14px}.nav button.active,.nav button:hover{background:#ffffff12;color:#fff}.sidebar-note{position:absolute;bottom:24px;left:20px;right:20px;font-size:11px;line-height:1.6;color:#9d978d}.content{padding:28px 32px 110px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.top h1{margin:0;font-size:27px;letter-spacing:-.5px}.top p{margin:7px 0 0;color:var(--muted);font-size:14px}.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:12px}.dot{width:7px;height:7px;background:var(--green);border-radius:50%}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:15px;box-shadow:0 2px 6px #493c2510}.stat b{font-size:23px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.toolbar{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}.search{flex:1;min-width:210px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 11px;font-size:13px}.filter{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;color:#514d46}.split{display:grid;grid-template-columns:minmax(550px,1.45fr) minmax(300px,.72fr);gap:16px}.detail{padding:18px;position:sticky;top:18px;height:max-content}.detail h2{font-size:18px;margin:0 0 6px}.detail .path{font-family:ui-monospace,monospace;font-size:11px;color:#6d675e;word-break:break-all;background:#f3efe6;padding:9px;border-radius:7px;margin:8px 0}.props{margin-top:16px;border-top:1px solid var(--line)}.prop{display:grid;grid-template-columns:102px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #ebe5d9;font-size:12px}.prop .key{color:var(--muted)}.tag{display:inline-block;background:#ece5ff;color:#634aa8;padding:3px 7px;border-radius:999px;margin:1px 3px 1px 0;font-size:11px}.actions{display:flex;gap:8px;margin-top:15px}.actions button{border:0;border-radius:8px;padding:9px 11px;background:#ece6dc;color:#3e3b35}.actions .primary{background:var(--accent);color:#fff}.footnote{font-size:11px;line-height:1.5;color:var(--muted);margin-top:13px}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-weight:600;background:#f7f3eb;padding:11px 13px;border-bottom:1px solid var(--line)}td{padding:12px 13px;border-bottom:1px solid #ece6da}tbody tr{cursor:pointer}tbody tr:hover,tbody tr.selected{background:#f1ebff}.status{font-size:11px;padding:4px 7px;border-radius:999px;white-space:nowrap}.verified{background:#e0f3e9;color:#267250}.review{background:#fff0d6;color:#9b601a}.todo{background:#eeeae3;color:#716b62}.cards{padding:14px;display:grid;grid-template-columns:repeat(2,minmax(240px,1fr));gap:13px}.course{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;cursor:pointer}.course:hover{border-color:#a58bdc;box-shadow:0 7px 20px #7557c51a}.course .cover{height:95px;border-radius:9px;background:linear-gradient(125deg,#dcd2ff,#6f55b7);margin-bottom:12px;padding:15px;color:#fff;display:flex;align-items:end;font-weight:700}.course:nth-child(2) .cover{background:linear-gradient(125deg,#c9e6d8,#4c8b71)}.course:nth-child(3) .cover{background:linear-gradient(125deg,#f4d5ad,#bd7428)}.meta{font-size:12px;color:var(--muted);margin-top:6px}.progress{height:6px;background:#eee8dd;border-radius:99px;margin-top:12px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px}.column{background:#f3efe7;border-radius:11px;padding:10px;min-height:400px}.column h3{font-size:13px;margin:3px 4px 12px;color:#5b564e}.item{background:#fff;border:1px solid var(--line);padding:12px;border-radius:9px;margin-bottom:9px;cursor:pointer}.item:hover{border-color:#a58bdc}.item b{font-size:13px;line-height:1.45}.item small{display:block;color:var(--muted);margin-top:8px}.switcher{position:fixed;z-index:20;left:50%;bottom:22px;transform:translateX(-50%);background:#181714;color:#fff;border:1px solid #ffffff25;border-radius:999px;padding:7px;display:flex;align-items:center;gap:8px;box-shadow:0 12px 35px #0005}.switcher button{width:34px;height:34px;border:0;border-radius:50%;background:#ffffff12;color:#fff;font-size:18px}.switcher span{min-width:220px;text-align:center;font-size:12px}.hint{color:#aaa;font-size:10px}.hidden{display:none!important}.yaml{font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#24221f;color:#e9e4da;padding:12px;border-radius:8px;white-space:pre-wrap;margin-top:13px}.prototype-flag{color:#ffce67;font-size:10px;letter-spacing:.08em}
    @media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{display:none}.content{padding:20px 16px 100px}.split{grid-template-columns:1fr}.detail{position:static}.stats{grid-template-columns:repeat(2,1fr)}.cards,.board{grid-template-columns:1fr}.switcher span{min-width:170px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">学习资料库<small>Obsidian 阅读视图</small></div>
    <div class="nav"><button class="active">▦ 视频资源</button><button>◫ 课程</button><button>⌕ 全文搜索</button><button>✓ 待复习</button><button>⚙ 数据状态</button></div>
    <div class="sidebar-note"><span class="prototype-flag">THROWAWAY PROTOTYPE</span><br>Media 保存完整包；这里模拟 Obsidian 如何阅读和组织最终笔记。</div>
  </aside>
  <main class="content">
    <header class="top"><div><h1 id="page-title">视频资源总览</h1><p id="page-sub">Properties 是每篇笔记的数据；Bases 将它们组织成可筛选的视图。</p></div><div class="pill"><i class="dot"></i>索引已更新 · 5 项</div></header>
    <section class="stats"><div class="stat"><b>5</b><span>视频资源</span></div><div class="stat"><b>3</b><span>已完成笔记</span></div><div class="stat"><b>2</b><span>课程 / 合集</span></div><div class="stat"><b>18</b><span>采用的证据截图</span></div></section>
    <div class="split">
      <section class="panel">
        <div class="toolbar"><input id="search" class="search" placeholder="搜索标题、主题、课程……"><select id="platform" class="filter"><option value="">全部平台</option><option>xiaoe</option><option>bilibili</option><option>youtube</option></select><select id="state" class="filter"><option value="">全部状态</option><option value="verified">已验证</option><option value="review">待写笔记</option><option value="todo">仅有素材</option></select></div>
        <div id="variant-a"><table><thead><tr><th>标题</th><th>平台</th><th>课程 / 章节</th><th>主题</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table></div>
        <div id="variant-b" class="hidden"><div class="cards" id="cards"></div></div>
        <div id="variant-c" class="hidden"><div class="board" id="board"></div></div>
      </section>
      <aside class="panel detail" id="detail"></aside>
    </div>
  </main>
</div>
<div class="switcher"><button id="prev">←</button><span><b id="variant-label">A · 资源表格</b><br><span class="hint">左右键切换方案</span></span><button id="next">→</button></div>
<script>
const items=[
 {id:'xet-v694f512',title:'16.9 机器人与目标框的距离计算',platform:'xiaoe',course:'小沫 ROS 智能体机器人课程',chapter:'第十六章 · 视觉算法',topics:['ROS','目标检测','距离计算'],status:'verified',statusText:'已验证',evidence:4,duration:'18:42',summary:'从目标框中心点、相机坐标和深度信息推导机器人到目标的距离。'},
 {id:'bili-BV1HD4',title:'搞懂什么是 PWM 控制',platform:'bilibili',course:'STM32 基础专题',chapter:'定时器与 PWM',topics:['STM32','PWM','定时器'],status:'verified',statusText:'已验证',evidence:5,duration:'12:08',summary:'解释占空比、频率和平均电压之间的关系，并通过示波器画面验证。'},
 {id:'bili-BV15iY',title:'DeepSeek Flash 与 GLM Flash 对比',platform:'bilibili',course:'AI 模型评测',chapter:'模型选择',topics:['LLM','成本','延迟'],status:'verified',statusText:'已验证',evidence:3,duration:'09:31',summary:'比较两种模型的调用成本、响应速度与适用任务。'},
 {id:'xet-v6933',title:'11.10 机器人 TF 和里程计计算流程',platform:'xiaoe',course:'小沫 ROS 智能体机器人课程',chapter:'第十一章 · 里程计与 TF',topics:['ROS','TF','里程计'],status:'review',statusText:'待写笔记',evidence:6,duration:'25:16',summary:'已有字幕和截图证据，等待完成结构化学习笔记。'},
 {id:'yt-ddq8',title:'Optimal Protocols for Studying & Learning',platform:'youtube',course:'Huberman Lab',chapter:'学习科学',topics:['学习','记忆','注意力'],status:'todo',statusText:'仅有素材',evidence:0,duration:'2:28:17',summary:'已保存音频和字幕，尚未进入画面证据与笔记阶段。'}
];
const names={a:'A · 资源表格',b:'B · 课程卡片',c:'C · 学习流程'};let current=items[0];
function status(s,t){return `<span class="status ${s}">${t}</span>`}
function renderRows(list=items){document.querySelector('#rows').innerHTML=list.map(x=>`<tr data-id="${x.id}" class="${current.id===x.id?'selected':''}"><td><b>${x.title}</b><div class="meta">${x.duration} · ${x.evidence} 张证据图</div></td><td>${x.platform}</td><td>${x.course}<div class="meta">${x.chapter}</div></td><td>${x.topics.slice(0,2).map(t=>`<span class="tag">${t}</span>`).join('')}</td><td>${status(x.status,x.statusText)}</td></tr>`).join('');document.querySelectorAll('#rows tr').forEach(r=>r.onclick=()=>select(r.dataset.id))}
function renderCards(){let groups=[...new Set(items.map(x=>x.course))];document.querySelector('#cards').innerHTML=groups.map((g,i)=>{let xs=items.filter(x=>x.course===g),done=xs.filter(x=>x.status==='verified').length;return `<div class="course" data-id="${xs[0].id}"><div class="cover">${g}</div><b>${g}</b><div class="meta">${xs.length} 个视频 · ${done} 篇已验证笔记</div><div class="progress"><i style="width:${done/xs.length*100}%"></i></div><div class="meta">主题：${[...new Set(xs.flatMap(x=>x.topics))].slice(0,4).join('、')}</div></div>`}).join('');document.querySelectorAll('.course').forEach(x=>x.onclick=()=>select(x.dataset.id))}
function renderBoard(){let cols=[['todo','素材箱'],['review','制作中'],['verified','已完成']];document.querySelector('#board').innerHTML=cols.map(([s,n])=>`<div class="column"><h3>${n} · ${items.filter(x=>x.status===s).length}</h3>${items.filter(x=>x.status===s).map(x=>`<div class="item" data-id="${x.id}"><b>${x.title}</b><small>${x.platform} · ${x.chapter}</small><small>${x.topics.map(t=>`#${t}`).join(' ')}</small></div>`).join('')}</div>`).join('');document.querySelectorAll('.item').forEach(x=>x.onclick=()=>select(x.dataset.id))}
function renderDetail(){let x=current;document.querySelector('#detail').innerHTML=`<div class="meta">当前选中的 Obsidian 笔记</div><h2>${x.title}</h2>${status(x.status,x.statusText)}<p style="font-size:13px;line-height:1.65">${x.summary}</p><div class="props"><div class="prop"><span class="key">platform</span><b>${x.platform}</b></div><div class="prop"><span class="key">course</span><span>${x.course}</span></div><div class="prop"><span class="key">chapter</span><span>${x.chapter}</span></div><div class="prop"><span class="key">topics</span><span>${x.topics.map(t=>`<i class="tag">${t}</i>`).join('')}</span></div><div class="prop"><span class="key">status</span><span>${x.status}</span></div><div class="prop"><span class="key">evidence_count</span><span>${x.evidence}</span></div></div><div class="yaml">---\nitem_id: ${x.id}\nplatform: ${x.platform}\ncourse: ${x.course}\nchapter: ${x.chapter}\ntopics: [${x.topics.join(', ')}]\nstatus: ${x.status}\n---</div><div class="meta" style="margin-top:14px">Media 权威工作包</div><div class="path">/Users/syz/Media/video-extract/items/${x.platform}/${x.id}/</div><div class="actions"><button class="primary">打开学习笔记</button><button>打开原视频 ↗</button></div><div class="footnote">Properties 就是上面的字段；Bases 根据这些字段生成左侧当前看到的表格、卡片或流程视图。大视频仍只保存在 Media。</div>`}
function select(id){current=items.find(x=>x.id===id);renderRows(filter());renderDetail()}
function filter(){let q=document.querySelector('#search').value.toLowerCase(),p=document.querySelector('#platform').value,s=document.querySelector('#state').value;return items.filter(x=>(!p||x.platform===p)&&(!s||x.status===s)&&(!q||JSON.stringify(x).toLowerCase().includes(q)))}
function applyFilter(){renderRows(filter())}document.querySelector('#search').oninput=applyFilter;document.querySelector('#platform').onchange=applyFilter;document.querySelector('#state').onchange=applyFilter;
function setVariant(v){let valid=['a','b','c'];if(!valid.includes(v))v='a';valid.forEach(x=>document.querySelector('#variant-'+x).classList.toggle('hidden',x!==v));document.querySelector('#variant-label').textContent=names[v];document.querySelector('#page-title').textContent={a:'视频资源总览',b:'按课程浏览',c:'学习资料流程'}[v];history.replaceState(null,'','?variant='+v);renderCards();renderBoard()}
function cycle(n){let a=['a','b','c'],v=new URLSearchParams(location.search).get('variant')||'a',i=(a.indexOf(v)+n+a.length)%a.length;setVariant(a[i])}document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.onkeydown=e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)};
renderRows();renderCards();renderBoard();renderDetail();setVariant(new URLSearchParams(location.search).get('variant')||'a');
</script>
</body>
</html>
